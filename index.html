<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14181f" />
  <title>Генератор идей для постов и сторис</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #14181f;
      --bg-elevated: #1c222c;
      --bg-panel: rgba(28, 34, 44, 0.72);
      --ink: #f4efe6;
      --muted: #a8a297;
      --accent: #ff6b4a;
      --accent-ink: #1a120f;
      --accent-soft: #ffb39a;
      --mint: #7fd6c2;
      --line: rgba(244, 239, 230, 0.12);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --bar: rgba(20, 24, 31, 0.82);
      --atmosphere-1: rgba(255, 107, 74, 0.22);
      --atmosphere-2: rgba(127, 214, 194, 0.16);
      --atmosphere-3: rgba(255, 179, 154, 0.1);
      --atmosphere-base: linear-gradient(165deg, #181d26 0%, #12161c 45%, #0e1218 100%);
      --hover-accent: rgba(255, 107, 74, 0.1);
      --hover-mint: rgba(127, 214, 194, 0.1);
      --grain-opacity: 0.045;
      --theme-icon-sun: 0;
      --theme-icon-moon: 1;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #e8eef4;
      --bg-elevated: #ffffff;
      --bg-panel: rgba(255, 255, 255, 0.82);
      --ink: #1a2230;
      --muted: #5d6a7a;
      --accent: #e85a3a;
      --accent-ink: #fff8f5;
      --accent-soft: #c24a30;
      --mint: #1f8f7a;
      --line: rgba(26, 34, 48, 0.1);
      --shadow: 0 10px 30px rgba(26, 40, 60, 0.1);
      --bar: rgba(232, 238, 244, 0.88);
      --atmosphere-1: rgba(232, 90, 58, 0.16);
      --atmosphere-2: rgba(31, 143, 122, 0.12);
      --atmosphere-3: rgba(90, 130, 180, 0.1);
      --atmosphere-base: linear-gradient(165deg, #eef3f8 0%, #e4ebf2 50%, #dce5ef 100%);
      --hover-accent: rgba(232, 90, 58, 0.08);
      --hover-mint: rgba(31, 143, 122, 0.08);
      --grain-opacity: 0.03;
      --theme-icon-sun: 1;
      --theme-icon-moon: 0;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
      overflow-x: hidden;
      transition: background 0.35s ease, color 0.35s ease;
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    }

    button {
      font: inherit;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 55% 45% at 8% 12%, var(--atmosphere-1), transparent 60%),
        radial-gradient(ellipse 45% 40% at 92% 18%, var(--atmosphere-2), transparent 55%),
        radial-gradient(ellipse 50% 35% at 70% 90%, var(--atmosphere-3), transparent 50%),
        var(--atmosphere-base);
      transition: opacity 0.35s ease;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.5;
      animation: drift 14s ease-in-out infinite alternate;
    }

    .blob-a {
      width: 280px;
      height: 280px;
      top: 8%;
      left: -40px;
      background: var(--accent);
      animation-duration: 16s;
    }

    .blob-b {
      width: 220px;
      height: 220px;
      top: 22%;
      right: -30px;
      background: var(--mint);
      animation-duration: 12s;
      animation-delay: -4s;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: var(--grain-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: calc(0.85rem + env(safe-area-inset-top)) 1.1rem 0.85rem;
      background: var(--bar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-brand {
      font-family: "Fraunces", serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .topbar-brand span {
      color: var(--accent);
    }

    .theme-toggle {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, background 0.3s ease;
      position: relative;
    }

    .theme-toggle:active {
      transform: scale(0.94);
    }

    .theme-toggle svg {
      width: 1.15rem;
      height: 1.15rem;
      position: absolute;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .icon-sun {
      opacity: var(--theme-icon-sun);
      transform: scale(calc(0.7 + var(--theme-icon-sun) * 0.3));
    }

    .icon-moon {
      opacity: var(--theme-icon-moon);
      transform: scale(calc(0.7 + var(--theme-icon-moon) * 0.3));
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 1.5rem 1.1rem 1rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-soft);
    }

    .eyebrow::before {
      content: "";
      width: 1.25rem;
      height: 2px;
      background: var(--accent);
    }

    .brand {
      font-family: "Fraunces", serif;
      font-size: clamp(1.9rem, 7vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      max-width: 12ch;
    }

    .brand em {
      font-style: italic;
      font-weight: 600;
      color: var(--accent);
    }

    .lead {
      margin-top: 0.85rem;
      color: var(--muted);
      max-width: 36ch;
      font-size: 0.98rem;
    }

    .desktop-cta {
      display: none;
      margin-top: 1.35rem;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 1.15rem 1rem 1rem;
      margin-bottom: 0.85rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(16px);
      animation: fade-up 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .panel:nth-of-type(1) { animation-delay: 0.08s; }
    .panel:nth-of-type(2) { animation-delay: 0.16s; }
    .panel:nth-of-type(3) { animation-delay: 0.24s; }

    .panel.is-refreshing {
      animation: panel-pulse 0.7s ease;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    h2 {
      font-family: "Fraunces", serif;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .tag {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mint);
      background: var(--hover-mint);
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
    }

    ol, ul {
      list-style: none;
      display: grid;
      gap: 0.25rem;
    }

    li {
      position: relative;
      padding: 0.8rem 0.75rem 0.8rem 2.35rem;
      border-radius: 0.85rem;
      color: var(--ink);
      font-size: 0.95rem;
      transition: background 0.25s ease, transform 0.25s ease, opacity 0.3s ease;
    }

    li.is-enter {
      animation: item-in 0.45s ease both;
    }

    @media (hover: hover) {
      li:hover {
        background: var(--hover-accent);
        transform: translateX(4px);
      }
    }

    ol {
      counter-reset: item;
    }

    ol li::before {
      content: counter(item);
      counter-increment: item;
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 1.2rem;
      color: var(--accent);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 0.88rem;
    }

    ul li::before {
      content: "";
      position: absolute;
      left: 0.95rem;
      top: 50%;
      width: 0.42rem;
      height: 0.42rem;
      border-radius: 50%;
      background: var(--mint);
      transform: translateY(-50%);
    }

    .plan {
      display: grid;
      gap: 0.2rem;
    }

    .plan-row {
      display: grid;
      grid-template-columns: 3.4rem 1fr;
      gap: 0.75rem;
      align-items: start;
      padding: 0.8rem 0.65rem;
      border-radius: 0.85rem;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .plan-row.is-enter {
      animation: item-in 0.45s ease both;
    }

    @media (hover: hover) {
      .plan-row:hover {
        background: var(--hover-mint);
        transform: translateX(3px);
      }
    }

    .day {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .plan-row p {
      color: var(--ink);
      font-size: 0.94rem;
      padding-top: 0.08rem;
    }

    .bottom-cta {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 0.75rem 1.1rem calc(0.75rem + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 55%, transparent);
      pointer-events: none;
    }

    .bottom-cta .generate-btn {
      pointer-events: auto;
      width: min(820px, 100%);
      margin: 0 auto;
      display: flex;
    }

    .generate-btn {
      position: relative;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      min-height: 3.35rem;
      padding: 0.9rem 1.25rem;
      border-radius: 1.15rem;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 28px var(--atmosphere-1);
      transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    .generate-btn:hover {
      filter: brightness(1.05);
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .generate-btn.is-loading {
      pointer-events: none;
    }

    .generate-btn .btn-label {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .generate-btn .spark {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
    }

    .generate-btn .btn-loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .generate-btn.is-loading .btn-label {
      opacity: 0;
      transform: translateY(6px);
    }

    .generate-btn.is-loading .btn-loader {
      opacity: 1;
    }

    .spinner {
      width: 1.35rem;
      height: 1.35rem;
      border: 2.5px solid rgba(26, 18, 15, 0.25);
      border-top-color: var(--accent-ink);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .generate-btn .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
      transform: translateX(-120%);
      pointer-events: none;
    }

    .generate-btn.is-loading .shine {
      animation: shine 0.9s ease;
    }

    .generate-btn.is-done {
      animation: btn-pop 0.45s ease;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes item-in {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes panel-pulse {
      0% { transform: scale(1); }
      40% { transform: scale(0.985); }
      100% { transform: scale(1); }
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(40px, 30px) scale(1.12); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes shine {
      to { transform: translateX(120%); }
    }

    @keyframes btn-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @media (min-width: 720px) {
      body {
        padding-bottom: 2rem;
      }

      .page {
        padding: 2.25rem 1.5rem 3rem;
      }

      .brand {
        max-width: 11ch;
      }

      .desktop-cta {
        display: block;
      }

      .desktop-cta .generate-btn {
        width: auto;
        min-width: 15rem;
        display: inline-flex;
      }

      .bottom-cta {
        display: none;
      }

      .panel {
        padding: 1.4rem 1.35rem 1.2rem;
        margin-bottom: 1rem;
      }

      .plan-row {
        grid-template-columns: 4rem 1fr;
      }
    }

    @media (max-width: 719px) {
      .blob {
        opacity: 0.35;
      }

      .topbar-brand {
        font-size: 0.98rem;
      }

      .brand {
        font-size: clamp(1.75rem, 8vw, 2.2rem);
      }

      .plan-row {
        grid-template-columns: 3rem 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }

      .panel, li, .plan-row {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <p class="topbar-brand">Идеи <span>постов</span></p>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="page">
    <header>
      <p class="eyebrow">для экспертов и авторов</p>
      <h1 class="brand">Генератор идей <em>для постов и сторис</em></h1>
      <p class="lead">Готовые темы, чтобы быстро наполнить ленту и сторис на неделю вперёд.</p>
      <div class="desktop-cta">
        <button class="generate-btn" type="button" data-generate>
          <span class="btn-label">
            <svg class="spark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2l1.2 6.3L19 12l-5.8 3.7L12 22l-1.2-6.3L5 12l5.8-3.7L12 2z" fill="currentColor"/>
            </svg>
            Сгенерировать идеи
          </span>
          <span class="btn-loader" aria-hidden="true"><span class="spinner"></span></span>
          <span class="shine" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <section class="panel" data-panel="posts">
      <div class="section-head">
        <h2>5 идей постов для экспертов</h2>
        <span class="tag">лента</span>
      </div>
      <ol id="postsList"></ol>
    </section>

    <section class="panel" data-panel="stories">
      <div class="section-head">
        <h2>3 идеи сторис на сегодня</h2>
        <span class="tag">сегодня</span>
      </div>
      <ul id="storiesList"></ul>
    </section>

    <section class="panel" data-panel="plan">
      <div class="section-head">
        <h2>Контент-план на неделю</h2>
        <span class="tag">7 дней</span>
      </div>
      <div class="plan" id="planList"></div>
    </section>
  </main>

  <div class="bottom-cta">
    <button class="generate-btn" type="button" data-generate>
      <span class="btn-label">
        <svg class="spark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2l1.2 6.3L19 12l-5.8 3.7L12 22l-1.2-6.3L5 12l5.8-3.7L12 2z" fill="currentColor"/>
        </svg>
        Сгенерировать идеи
      </span>
      <span class="btn-loader" aria-hidden="true"><span class="spinner"></span></span>
      <span class="shine" aria-hidden="true"></span>
    </button>
  </div>

  <script>
    const POSTS = [
      "«Ошибка, которую я вижу у 9 из 10 клиентов» — разбор с решением.",
      "Кейс: «Было → стало» с цифрами и коротким выводом.",
      "«Миф vs реальность» в вашей нише — 3 пункта и ваш вердикт.",
      "Чек-лист из 7 шагов для новичков по вашей теме.",
      "«Вопрос аудитории» — ответьте на самый частый комментарий недели.",
      "Разбор инструмента, которым вы пользуетесь каждый день.",
      "«Что я изменила бы, начиная путь заново» — 5 честных пунктов.",
      "Сравнение: быстрый способ vs правильный способ.",
      "Мини-гайд: как сделать результат за 30 минут.",
      "История провала и какой урок из него вынесли.",
      "Топ-3 книги/ресурса, которые реально помогли в работе.",
      "«Стоп-лист»: что перестать делать в вашей теме прямо сейчас."
    ];

    const STORIES = [
      "Утренний опрос: «Что вам сложнее всего прямо сейчас?»",
      "За кулисами: 15 секунд рабочего процесса или подготовки.",
      "Мини-совет дня + призыв сохранить сторис.",
      "До/после одного маленького улучшения.",
      "Голосовой ответ на вопрос из директа.",
      "Таймер-челлендж: сделайте задачу за 5 минут вместе.",
      "Карточка с одной цитатой и вашей короткой расшифровкой.",
      "Слайдер «согласны / не согласны» по спорному тезису."
    ];

    const PLAN = [
      ["Пн", "Пост-разбор ошибки + сторис-опрос по теме поста."],
      ["Вт", "Сторис «за кулисами» + напоминание о полезном посте."],
      ["Ср", "Пост-кейс «было → стало»."],
      ["Чт", "Сторис с мини-советом и вопросом в директ."],
      ["Пт", "Пост «миф vs реальность»."],
      ["Сб", "Лёгкий сторис-день: настроение, процесс, сохранение совета."],
      ["Вс", "Пост-чек-лист или ответы на вопросы аудитории."],
      ["Пн", "Пост с чек-листом + сторис «сохраните себе»."],
      ["Вт", "Сторис-опрос и сбор вопросов в директ."],
      ["Ср", "Пост-кейс с одной сильной цифрой."],
      ["Чт", "Сторис «за кулисами» подготовки к пятничному посту."],
      ["Пт", "Пост «миф vs реальность» + сторис с вердиктом."],
      ["Сб", "Сторис-день: 3 коротких совета подряд."],
      ["Вс", "Итоги недели и анонс темы на понедельник."]
    ];

    const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

    const postsList = document.getElementById("postsList");
    const storiesList = document.getElementById("storiesList");
    const planList = document.getElementById("planList");
    const themeToggle = document.getElementById("themeToggle");
    const generateButtons = document.querySelectorAll("[data-generate]");
    const metaTheme = document.querySelector('meta[name="theme-color"]');

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function pick(arr, count) {
      return shuffle(arr).slice(0, count);
    }

    function buildWeekPlan() {
      const byDay = Object.fromEntries(DAYS.map((day) => [day, []]));
      PLAN.forEach(([day, text]) => byDay[day].push(text));
      return DAYS.map((day) => {
        const options = byDay[day];
        return [day, options[Math.floor(Math.random() * options.length)]];
      });
    }

    function renderIdeas(animate) {
      const posts = pick(POSTS, 5);
      const stories = pick(STORIES, 3);
      const plan = buildWeekPlan();

      postsList.innerHTML = posts
        .map((text, i) => `<li class="${animate ? "is-enter" : ""}" style="animation-delay:${i * 0.05}s">${text}</li>`)
        .join("");

      storiesList.innerHTML = stories
        .map((text, i) => `<li class="${animate ? "is-enter" : ""}" style="animation-delay:${i * 0.05}s">${text}</li>`)
        .join("");

      planList.innerHTML = plan
        .map(
          ([day, text], i) =>
            `<div class="plan-row ${animate ? "is-enter" : ""}" style="animation-delay:${i * 0.04}s"><span class="day">${day}</span><p>${text}</p></div>`
        )
        .join("");

      if (animate) {
        document.querySelectorAll(".panel").forEach((panel) => {
          panel.classList.remove("is-refreshing");
          void panel.offsetWidth;
          panel.classList.add("is-refreshing");
        });
      }
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("ideas-theme", theme);
      metaTheme.setAttribute("content", theme === "light" ? "#e8eef4" : "#14181f");
      themeToggle.setAttribute(
        "aria-label",
        theme === "light" ? "Включить тёмную тему" : "Включить светлую тему"
      );
    }

    function initTheme() {
      const saved = localStorage.getItem("ideas-theme");
      if (saved === "light" || saved === "dark") {
        setTheme(saved);
        return;
      }
      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      setTheme(prefersLight ? "light" : "dark");
    }

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      setTheme(next);
    });

    let generating = false;

    async function generateIdeas() {
      if (generating) return;
      generating = true;
      generateButtons.forEach((btn) => {
        btn.classList.add("is-loading");
        btn.classList.remove("is-done");
      });

      await new Promise((resolve) => setTimeout(resolve, 900));
      renderIdeas(true);

      generateButtons.forEach((btn) => {
        btn.classList.remove("is-loading");
        btn.classList.add("is-done");
      });

      setTimeout(() => {
        generateButtons.forEach((btn) => btn.classList.remove("is-done"));
        generating = false;
      }, 450);
    }

    generateButtons.forEach((btn) => btn.addEventListener("click", generateIdeas));

    initTheme();
    renderIdeas(false);
  </script>
</body>
</html>
